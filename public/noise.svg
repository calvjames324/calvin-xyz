<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
    <feComponentTransfer in="mono" result="whiteNoise">
      <feFuncR type="linear" slope="1.8" intercept="0.15" />
      <feFuncG type="linear" slope="1.8" intercept="0.15" />
      <feFuncB type="linear" slope="1.8" intercept="0.15" />
      <feFuncA type="linear" slope="1" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)" />
</svg>
